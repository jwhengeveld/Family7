# Projectdefinitie voor XcodeGen. Het .xcodeproj wordt hieruit gegenereerd en
# staat niet in git:  ./scripts/fetch-cast-sdk.sh && xcodegen
name: Family7
options:
  bundleIdPrefix: nl.family7
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.13.9"
  # De statische Cast SDK verwacht GTMSessionFetcher erbij (CocoaPods regelt
  # dat stilzwijgend; zonder CocoaPods moet hij hier).
  GTMSessionFetcher:
    url: https://github.com/google/gtm-session-fetcher.git
    from: "5.3.1"

targets:
  Family7:
    type: application
    platform: iOS
    sources:
      - path: Family7
        excludes: ["**/._*"]
      # De Cast SDK is statisch gelinkt; zijn bundels (teksten, iconen,
      # lettertypen van de apparatenkiezer) moeten daarom zelf mee in de app.
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleCastCoreResources.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleCastUIResources.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleCastOptionalUIResources.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/MaterialDialogs.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleSansRegular.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleSansMedium.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleSansBold.bundle
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      - package: GTMSessionFetcher
        product: GTMSessionFetcherCore
      - framework: Vendor/GoogleCast.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.family7.ios
        PRODUCT_NAME: Family7
        INFOPLIST_FILE: Family7/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-lc++"]
        # Het receiver-ID van Google Cast; CC1AD845 is de Default Media Receiver.
        FAMILY7_CAST_RECEIVER_ID: CC1AD845
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic

  Family7Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Family7Tests
        excludes: ["**/._*"]
    dependencies:
      - target: Family7
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nl.family7.ios.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Family7.app/Family7"

schemes:
  Family7:
    build:
      targets:
        Family7: all
        Family7Tests: [test]
    test:
      targets: [Family7Tests]
